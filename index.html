<html lang="es">
<head>
<meta charset="utf-8">

<title>Ruta 120209 · Control de Cobros</title>
<style>
:root{--blue:#0b74ff;--dark:#071a2d;--bg:#f3f7fb;--ok:#0a9b62;--muted:#66788a;--danger:#d83a3a}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:#102131}
header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,#071a2d,#0b74ff);color:white;padding:9px 12px 8px;box-shadow:0 3px 12px #0002}
h1{font-size:19px;margin:0 0 2px} .sub{font-size:11px;opacity:.85}
.summary-toggle{width:100%;margin-top:6px;padding:7px 10px;background:#ffffff16;border:1px solid #ffffff30;border-radius:9px;color:white;font-size:11px;font-weight:800;text-align:left;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.summary-toggle .arrow{font-size:13px;transition:transform .15s ease}
.summary-toggle + .summary-toggle{margin-top:5px}
.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;margin-top:6px;max-height:0;overflow:hidden;opacity:0;transition:max-height .18s ease,opacity .12s ease}
header.summary-open .summary{max-height:calc(100vh - 125px);opacity:1;overflow-y:auto;padding-bottom:8px}
header.summary-open .summary-toggle .arrow{transform:rotate(180deg)}
.box{background:#ffffff18;border:1px solid #ffffff30;border-radius:9px;padding:6px;text-align:center}
.box b{display:block;font-size:15px;line-height:1.1} .box span{font-size:9px;opacity:.85} .deposit-box{grid-column:1/-1;text-align:left;min-height:82px}.deposit-control{display:flex;gap:6px;align-items:center;margin-top:6px}.deposit-control input{flex:1;min-width:0;padding:7px 8px;border:1px solid #ffffff40;border-radius:7px;background:#ffffff12;color:white;font-weight:800;font-size:14px}.deposit-control input::placeholder{color:#ffffff99}.deposit-box>span{display:block;font-size:12px!important;opacity:.95}.deposit-control button{padding:7px 9px;background:#ffffff20;color:white;border:1px solid #ffffff35}.deposit-control input:focus{outline:2px solid #ffffff55}.deposit-current{margin-top:6px;font-size:11px;color:#fff;opacity:.95}.deposit-current b{font-size:14px}
.controls{padding:8px 12px;display:flex;gap:7px;position:sticky;top:64px;z-index:9;background:var(--bg);border-bottom:1px solid #dce5ee}
input.search{flex:1;padding:11px;border:1px solid #cbd7e3;border-radius:10px;font-size:14px;background:white}
button{border:0;border-radius:9px;padding:10px 12px;font-weight:700;cursor:pointer}
.btn{background:#e7eef6;color:#17324a} .primary{background:var(--blue);color:white}
main{padding:8px 10px 70px;max-width:760px;margin:auto}
.card{background:white;border:1px solid #dbe4ec;border-radius:13px;padding:11px;margin:8px 0;box-shadow:0 2px 7px #17324a0d}
.row{display:flex;gap:9px;align-items:flex-start} .num{width:28px;height:28px;border-radius:50%;background:#e8f1ff;color:#0759c7;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.name{font-weight:800;font-size:14px;line-height:1.2} .code{font-size:11px;color:var(--muted);margin-top:2px}
.status{margin-left:auto;font-size:11px;font-weight:800} .pending{color:#9a6a00} .saved{color:var(--ok)}
.collectors{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 7px}
.collector{background:#edf2f7;color:#244158;border:2px solid transparent;padding:9px 5px;font-size:12px}
.collector.selected{background:#e6f1ff;border-color:var(--blue);color:#005bd4}
.payment-title{font-size:12px;font-weight:800;margin:9px 0 5px;color:#244158}
.payments{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 8px}
.payment{background:#f4f7fa;color:#244158;border:2px solid transparent;padding:9px 4px;font-size:11px}
.payment.selected{background:#e9f8f1;border-color:var(--ok);color:#08744b}
.diagnostics{position:fixed;right:8px;bottom:58px;z-index:30;background:#071a2d;color:#d9f2ff;border-radius:8px;padding:5px 8px;font:10px monospace;opacity:.85}
.amount{display:flex;gap:7px} .amount input{flex:1;padding:11px;border:1px solid #cbd7e3;border-radius:9px;font-size:16px}
.amount .save{min-width:105px;background:var(--ok);color:white} .amount .edit{background:#ffe9e9;color:#a52323}
footer{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #d7e1ea;padding:8px 10px;display:flex;gap:7px;z-index:20}
footer button{flex:1;font-size:12px} .empty{text-align:center;color:var(--muted);padding:30px}
.modal{display:none;position:fixed;inset:0;background:#0007;z-index:50;align-items:flex-end;justify-content:center}
.modal.open{display:flex} .sheet{background:white;width:100%;max-width:760px;border-radius:18px 18px 0 0;padding:18px;max-height:80vh;overflow:auto}
.sheet h2{margin:0 0 10px;font-size:18px} .tot{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #eee}
.small{font-size:11px;color:var(--muted)}
.cash-details{margin:6px 0 8px;border:1px solid #dbe4ec;border-radius:10px;background:#f8fafc;overflow:hidden}.cash-details summary{cursor:pointer;padding:10px;font-size:12px;font-weight:800;color:#244158;list-style:none}.cash-details summary::-webkit-details-marker{display:none}.cash-details summary:after{content:"▾";float:right}.cash-details[open] summary:after{content:"▴"}.bills{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;padding:0 8px 8px}.bill{display:flex;align-items:center;justify-content:space-between;gap:6px;background:white;border:1px solid #dbe4ec;border-radius:8px;padding:6px 7px;font-size:12px}.bill input{width:62px;padding:7px;border:1px solid #cbd7e3;border-radius:7px;text-align:center}.cash-total{padding:8px;border-top:1px solid #e1e8ef;text-align:right;font-weight:800;font-size:12px}.cash-warning{color:#b42318;font-size:11px;padding:0 8px 8px}.cash-ok{color:var(--ok);font-size:11px;padding:0 8px 8px}

</style>
</head>
<body>
<header>
<h1>🚚 Ruta 120209 · Control de Cobros</h1>
<div class="sub"><span id="clientCountLabel">32</span> clientes · Ruta <span id="routeLabel">120209</span> · 23/09/2026</div>
<button class="summary-toggle" onclick="toggleGeneralData()">📊 Datos generales <span class="arrow">▾</span></button><button class="summary-toggle" onclick="editCollectors()">👤 Editar cobradores <span>✏️</span></button>
<div class="summary"><div class="box"><b id="reportVta">Q0.00</b><span>VTA total del reporte</span></div>
<div class="box"><b id="balance">Q0.00</b><span>balance a recolectar</span><button class="balance-edit" onclick="editRouteBalance()">✏️ Editar</button></div>
<div class="box"><b id="remaining">Q0.00</b><span>saldo por recolectar</span></div>
<div class="box"><b id="count">0/35</b><span>cliente cobrado</span></div>
<div class="box"><b id="total">Q0.00</b><span>total cobrado</span></div>
<div class="box"><b id="pending">35</b><span>pendiente</span></div><div class="box deposit-box"><span>💰 Depositado</span><div class="deposit-control"><input id="depositInput" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Cantidad en quetzales" oninput="autoSaveDeposit(this.value)" onchange="saveDeposit()"><button onclick="saveDeposit(true)">Guardar</button></div><div class="deposit-current">Efectivo actual: <b id="currentCash">Q0.00</b></div></div>
</div>
</header>
<div class="controls">
<input id="search" class="search" placeholder="Buscar cliente o código…">
<button class="btn" onclick="openSummary()">📊 Resumen</button>
</div>
<main id="list"></main>
<footer>
<button class="btn" onclick="exportCSV()">⬇️ Exportar</button>
<button class="btn" onclick="backup()">💾 Respaldo</button>
<button class="primary" onclick="clearRoute()">🔒 Cerrar/limpiar ruta</button>
</footer>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
<div class="sheet"><h2>Resumen por cobrador</h2><div id="summary"></div>
<button class="primary" style="width:100%;margin-top:12px" onclick="closeModal()">Cerrar</button></div>
</div>
<div id="diagnostics" class="diagnostics">Diagnóstico: OK</div>

<script>

const CLIENTS=[{"n":1,"c":"0001134676","name":"TIENDA LA CUADRA","incisos":["120209"],"vta":0.0},{"n":2,"c":"0001342789","name":"tienda nahomy","incisos":["120209"],"vta":0.0},{"n":3,"c":"0001338765","name":"ABARROTERIA LA BENDICION","incisos":["120209"],"vta":0.0},{"n":4,"c":"0001054626","name":"TIENDAGABY","incisos":["120209"],"vta":0.0},{"n":5,"c":"0001288567","name":"TIENDA LA SELECTA 2","incisos":["120209"],"vta":0.0},{"n":6,"c":"0001413941","name":"TIENDA REFUGIO DIVINO","incisos":["120209"],"vta":0.0},{"n":7,"c":"0001307942","name":"TIENDA Y DEPOSITO DE MAIZ","incisos":["120209"],"vta":0.0},{"n":8,"c":"0001452385","name":"ABARROTERIA GAEL","incisos":["120209"],"vta":0.0},{"n":9,"c":"0001178521","name":"PANADERIA SOFIA","incisos":["120209"],"vta":0.0},{"n":10,"c":"0001365112","name":"TIENDA JACKELINE","incisos":["120209"],"vta":0.0},{"n":11,"c":"0001054611","name":"TIENDA LA BODEGITA","incisos":["120209"],"vta":0.0},{"n":12,"c":"0001405995","name":"TIENDA LUX","incisos":["120209"],"vta":0.0},{"n":13,"c":"0001054602","name":"TIENDA LA BENDICION","incisos":["120209"],"vta":0.0},{"n":14,"c":"0001134674","name":"TIENDA MARIANA","incisos":["120209"],"vta":0.0},{"n":15,"c":"0001054703","name":"TIENDA YOLANDITA","incisos":["120209"],"vta":0.0},{"n":16,"c":"0001054704","name":"DISTRIBUIDORA SAN CRISTOBAL","incisos":["120209"],"vta":0.0},{"n":17,"c":"0001228150","name":"TIENDA FEVA","incisos":["120209"],"vta":0.0},{"n":18,"c":"0001318316","name":"PANADERIA DONA NESHITA","incisos":["120209"],"vta":0.0},{"n":19,"c":"0001244183","name":"GRAN DEPOSITO LA FE","incisos":["120209"],"vta":0.0},{"n":20,"c":"0001328800","name":"TIENDA SAN FELIPE","incisos":["120209"],"vta":0.0},{"n":21,"c":"0001055528","name":"TIENDA Y PANADERIA RIVERA","incisos":["120209"],"vta":0.0},{"n":22,"c":"0001386404","name":"TIENDA Y VARIEDADES YARETZY","incisos":["120209"],"vta":0.0},{"n":23,"c":"0001392476","name":"PERLA DORADA","incisos":["120209"],"vta":0.0},{"n":24,"c":"0001206005","name":"MINI ABARROTERIA EL CENTRO","incisos":["120209"],"vta":0.0},{"n":25,"c":"0001424559","name":"GRANJERO SAN CRISTOBAL VE 184","incisos":["120209"],"vta":0.0},{"n":26,"c":"0001432872","name":"PIZZA LA SICILIANA 814","incisos":["120209"],"vta":0.0},{"n":27,"c":"0001448927","name":"ESTRELLITA","incisos":["120209"],"vta":0.0},{"n":28,"c":"0001053742","name":"TIENDA MARIBEL","incisos":["120209"],"vta":0.0},{"n":29,"c":"0001441241","name":"TD LOS ABUELOS","incisos":["120209"],"vta":0.0},{"n":30,"c":"0001365233","name":"TIENDA LA BENDICION","incisos":["120209"],"vta":0.0},{"n":31,"c":"0001338754","name":"TIENDA JACKELINE 4","incisos":["120209"],"vta":0.0},{"n":32,"c":"0001247930","name":"TIENDA LA BENDICION","incisos":["120209"],"vta":0.0}];
const REPORT_VTA_TOTAL=0;
const ROUTE_ID="120209";
// Balance objetivo por ruta. Para otra ruta, agrega/cambia su valor aquí.
const ROUTE_BALANCES={"120209":0};
let ROUTE_BALANCE=Number(ROUTE_BALANCES[ROUTE_ID]||0);
const KEY="ruta120209_cobros_v1";
const BALANCE_KEY="ruta120209_balance_v1";
const savedRouteBalance=localStorage.getItem(BALANCE_KEY);
if(savedRouteBalance!==null && Number.isFinite(Number(savedRouteBalance))) ROUTE_BALANCE=Number(savedRouteBalance);
const NAMES_KEY="ruta120209_cobradores_v1";
let NAMES=JSON.parse(localStorage.getItem(NAMES_KEY)||'["Daniel","Hairo","Rulio"]');
if(!Array.isArray(NAMES)||NAMES.length!==3) NAMES=["Daniel","Hairo","Rulio"];
function saveNames(){localStorage.setItem(NAMES_KEY,JSON.stringify(NAMES));}
function editCollectors(){
  const updated=NAMES.map((name,i)=>{
    const value=prompt(`Nombre del cobrador ${i+1}:`,name);
    if(value===null) return name;
    const clean=String(value).trim();
    return clean||name;
  });
  if(updated.some((n,i)=>n!==NAMES[i])){
    NAMES=updated;
    saveNames();
    // Actualizar también el nombre almacenado en registros existentes.
    Object.values(state).forEach(s=>{
      if(s && s.collector!=null){
        const idx=Number(s.collector);
        if(Number.isInteger(idx) && NAMES[idx]) s.collectorName=NAMES[idx];
      }
    });
    saveState();
    render();
  }
}
let state=JSON.parse(localStorage.getItem(KEY)||"{}");

function saveState(){localStorage.setItem(KEY,JSON.stringify(state));}
const BILL_DENOMS=[200,100,50,20,10,5,1];
function calcBills(bills){return BILL_DENOMS.reduce((sum,d)=>sum+d*Number((bills&&bills[d])||0),0);}
function setBill(code,denom,value){
  if(!state[code]) state[code]={};
  if(!state[code].bills) state[code].bills={};
  const n=Math.max(0,parseInt(value,10)||0);
  state[code].bills[denom]=n;
  state[code].cashOpen=true; saveState(); render();
}
function money(v){return "Q"+Number(v||0).toLocaleString("es-GT",{minimumFractionDigits:2,maximumFractionDigits:2})}
function editRouteBalance(){
  const current=ROUTE_BALANCE.toFixed(2);
  const value=prompt("Ingresa el balance a recolectar para esta ruta (Q):",current);
  if(value===null)return;
  const normalized=String(value).replace(/,/g,"").trim();
  const n=Number(normalized);
  if(!Number.isFinite(n)||n<0){alert("Agrega un monto válido, igual o mayor a Q0.00.");return;}
  ROUTE_BALANCE=Math.round(n*100)/100;
  localStorage.setItem(BALANCE_KEY,String(ROUTE_BALANCE));
  render();
}
const DEPOSIT_KEY=KEY+"_deposit_v2";
const OLD_DEPOSIT_KEY=KEY+"_depositado_v1";
function readDeposit(){
  try{
    let raw=localStorage.getItem(DEPOSIT_KEY);
    if(raw===null) raw=localStorage.getItem(OLD_DEPOSIT_KEY);
    const n=Number(raw);
    return Number.isFinite(n)&&n>=0?n:0;
  }catch(e){return 0;}
}
let DEPOSITADO=readDeposit();
function persistDeposit(value){
  DEPOSITADO=Math.round(Math.max(0,Number(value)||0)*100)/100;
  try{localStorage.setItem(DEPOSIT_KEY,String(DEPOSITADO));}catch(e){
    const d=document.getElementById("diagnostics");
    if(d)d.textContent="Diagnóstico: no se pudo guardar Depositado en el almacenamiento local";
  }
}
function saveDeposit(showMessage=false){
  const input=document.getElementById("depositInput");
  if(!input)return;
  const normalized=String(input.value).replace(/,/g,"").trim();
  const n=Number(normalized);
  if(!Number.isFinite(n)||n<0){alert("Agrega un monto válido, igual o mayor a Q0.00.");return;}
  persistDeposit(n);
  updateStats();
  if(showMessage) alert("Depositado guardado: "+money(DEPOSITADO));
}
function updateDepositDisplay(){
  const input=document.getElementById("depositInput");
  if(input && document.activeElement!==input) input.value=DEPOSITADO?DEPOSITADO.toFixed(2):"";
}

function autoSaveDeposit(value){
  const normalized=String(value).replace(/,/g,"").trim();
  if(normalized===""){persistDeposit(0);updateStats();return;}
  const n=Number(normalized);
  if(Number.isFinite(n)&&n>=0) persistDeposit(n);
}

function render(){
 const q=document.getElementById("search").value.toLowerCase().trim();
 const list=document.getElementById("list"); list.innerHTML="";
 const filtered=CLIENTS.filter(x=>!q||x.name.toLowerCase().includes(q)||x.c.includes(q));
 if(!filtered.length){list.innerHTML='<div class="empty">No encontré clientes con esa búsqueda.</div>';return;}
 filtered.forEach(x=>{
   const s=state[x.c]||{};
   const card=document.createElement("div"); card.className="card";
   const selected=s.collector||"";
   card.innerHTML=`
    <div class="row"><div class="num">${x.n}</div><div><div class="name">${x.name}</div><div class="code">Incisos: ${(x.incisos||[]).join(" · ")} · ${x.c}</div><div class="code" style="color:#0759c7;font-weight:800">VTA facturas: ${money(x.vta)} · Código: ${x.c}</div></div>
    <div class="status ${s.amount!=null?'saved':'pending'}">${s.amount!=null?'✓ GUARDADO':'PENDIENTE'}</div></div>
    <div class="collectors">
      ${NAMES.map((n,i)=>`<button class="collector ${selected===String(i)?'selected':''}" onclick="pick('${x.c}','${i}')">${n}</button>`).join("")}
    </div>
    <div class="payment-title">Forma de pago</div>
    <div class="payments">
      ${["Efectivo","Transferencia","Depósito","Crédito"].map((m,i)=>`<button class="payment ${s.paymentMethod===m?'selected':''}" onclick="pickPayment('${x.c}','${m}')">${s.paymentMethod===m?'✓ ':''}${m}</button>`).join("")}
    </div>
    ${s.paymentMethod==='Efectivo'?`<details class="cash-details" ${s.cashOpen?'open':''}>
      <summary>💵 Billetes y denominaciones</summary>
      <div class="bills">
        ${[200,100,50,20,10,5,1].map(d=>`<label class="bill"><span>Q${d}</span><input type="number" min="0" step="1" inputmode="numeric" value="${(s.bills&&s.bills[d])||0}" onchange="setBill('${x.c}',${d},this.value)" onclick="event.stopPropagation()"></label>`).join("")}
      </div>
      <div class="cash-total">Total en billetes: <span id="cash-total-${x.c}">${money(calcBills(s.bills))}</span></div>
      ${s.amount!=null && Math.abs(calcBills(s.bills)-Number(s.amount))>.009?`<div class="cash-warning">⚠️ Los billetes no coinciden con el cobro de ${money(s.amount)}.</div>`:(s.amount!=null?`<div class="cash-ok">✓ Los billetes coinciden con el cobro.</div>`:'')}
    </details>`:''}
    <div class="amount">
      <input id="amt-${x.c}" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Cantidad Q" value="${s.amount??x.vta}" ${s.amount!=null?'disabled':''}>
      ${s.amount!=null?`<button class="edit" onclick="editClient('${x.c}')">Editar</button>`:`<button class="save" onclick="saveClient('${x.c}')">Guardar</button>`}
    </div>`;
   list.appendChild(card);
 });
 updateStats();
 {
      const clientVtaSum=CLIENTS.reduce((a,x)=>a+(Number(x.vta)||0),0);
      const diff=REPORT_VTA_TOTAL-clientVtaSum;
      document.getElementById("diagnostics").textContent=
        `Diagnóstico: ${Object.keys(state).length} registros guardados · Depositado ${money(DEPOSITADO)} · VTA reporte ${money(REPORT_VTA_TOTAL)} · VTA clientes ${money(clientVtaSum)} · diferencia ${money(diff)}`;
    }
}
function pick(code,i){
 if(!state[code]) state[code]={};
 state[code].collector=String(i); state[code].collectorName=NAMES[i]; saveState(); render();
}
function pickPayment(code,method){
 if(!state[code]) state[code]={};
 state[code].paymentMethod=method;
 if(method==='Efectivo'){state[code].cashOpen=true;}
 saveState(); render();
}
function saveClient(code){
 const s=state[code]||{}; if(s.collector==null){alert("Primero marca uno de los 3 cobradores.");return;}
 if(!s.paymentMethod){alert("Primero marca la forma de pago: efectivo, transferencia, depósito o crédito.");return;}
 const input=document.getElementById("amt-"+code); const v=parseFloat(input.value);
 if(!Number.isFinite(v)||v<0){alert("Agrega una cantidad válida.");return;}
 if(s.paymentMethod==='Efectivo'){
   const billsTotal=calcBills(s.bills);
   if(Math.abs(billsTotal-v)>.009){
     alert(`⚠️ Los billetes suman ${money(billsTotal)} y el cobro es ${money(v)}.\n\nNo coinciden, pero el cobro SÍ se guardará.`);
   }
 }
 s.amount=Math.round(v*100)/100; s.savedAt=new Date().toISOString(); state[code]=s; saveState(); render();
}
function editClient(code){ if(!state[code])return; delete state[code].amount; delete state[code].savedAt; saveState(); render(); setTimeout(()=>document.getElementById("amt-"+code)?.focus(),30);}
function updateStats(){
 let done=0,total=0; Object.values(state).forEach(s=>{if(s.amount!=null){done++;total+=Number(s.amount)||0;}});
 const remaining=Math.max(0,ROUTE_BALANCE-total);
 const efectivoActual=Math.max(0,total-DEPOSITADO);
 document.getElementById("balance").textContent=money(ROUTE_BALANCE);
 document.getElementById("remaining").textContent=money(remaining);
 document.getElementById("count").textContent=`${done}/${CLIENTS.length}`;
 document.getElementById("total").textContent=money(total);
 document.getElementById("total").title="Efectivo actual: "+money(efectivoActual);
 document.getElementById("pending").textContent=Math.max(0,CLIENTS.length-done);
 updateDepositDisplay();
 const currentCash=document.getElementById("currentCash");
 if(currentCash) currentCash.textContent=money(efectivoActual);
}
document.getElementById("search").addEventListener("input",render);

function toggleGeneralData(){
  const header=document.querySelector("header");
  const controls=document.querySelector(".controls");
  if(!header)return;
  const open=!header.classList.contains("summary-open");
  header.classList.toggle("summary-open",open);
  if(controls)controls.style.top="64px";
}

function openSummary(){
 const sums=NAMES.map((n,i)=>({name:n,count:0,total:0}));
 const payments=["Efectivo","Transferencia","Depósito","Crédito"];
 const psums=Object.fromEntries(payments.map(m=>[m,{count:0,total:0}]));
 Object.values(state).forEach(s=>{
   if(s.amount!=null){
     if(s.collector!=null){let a=sums[Number(s.collector)]; if(a){a.count++;a.total+=Number(s.amount)||0;}}
     if(s.paymentMethod && psums[s.paymentMethod]){psums[s.paymentMethod].count++;psums[s.paymentMethod].total+=Number(s.amount)||0;}
   }
 });
 const done=Object.values(state).filter(s=>s.amount!=null).length;
 const total=Object.values(psums).reduce((a,x)=>a+x.total,0);
 document.getElementById("summary").innerHTML=
 `<h3 style="margin:4px 0 6px">Por cobrador</h3>`+
 sums.map(x=>`<div class="tot"><div><b>${x.name}</b><div class="small">${x.count} clientes</div></div><b>${money(x.total)}</b></div>`).join("")+
 `<h3 style="margin:16px 0 6px">Por forma de pago</h3>`+
 payments.map(m=>`<div class="tot"><div><b>${m}</b><div class="small">${psums[m].count} clientes</div></div><b>${money(psums[m].total)}</b></div>`).join("")+
 `<div class="tot" style="background:#eef8f3"><b>TOTAL</b><b>${money(total)}</b></div>
 <p class="small">Cobrado: ${done} de ${CLIENTS.length} · Pendientes: ${Math.max(0,CLIENTS.length-done)}</p>`;
 document.getElementById("modal").classList.add("open");
}

function closeModal(){document.getElementById("modal").classList.remove("open");}
function exportCSV(){
 let rows=[["No.","Codigo","Cliente","Incisos","Cobrador","Forma de pago","Cantidad Q","Q200","Q100","Q50","Q20","Q10","Q5","Q1","Fecha/hora"]];
 CLIENTS.forEach(x=>{const s=state[x.c]||{};rows.push([x.n,x.c,x.name,(x.incisos||[]).join(" / "),s.collectorName||"",s.paymentMethod||"",s.amount??"",...BILL_DENOMS.map(d=>(s.bills&&s.bills[d])||0),s.savedAt?new Date(s.savedAt).toLocaleString("es-GT"):""]);});
 const csv=rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));a.download="Ruta_120209_Cobros.csv";a.click();
}
function backup(){
 const blob=new Blob([JSON.stringify({route:"120209",date:"2026-09-23",state,depositado:DEPOSITADO},null,2)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="Respaldo_Ruta_120209.json";a.click();
}
function clearRoute(){
 const pin=prompt("Para limpiar la ruta escribe CERRAR:");
 if(pin==="CERRAR"){localStorage.removeItem(KEY);localStorage.removeItem(DEPOSIT_KEY);localStorage.removeItem(OLD_DEPOSIT_KEY);state={};DEPOSITADO=0;render();alert("Ruta 120209 limpiada. El respaldo exportado queda en tu teléfono.");}
}
window.addEventListener("error",e=>{
 const d=document.getElementById("diagnostics");
 if(d)d.textContent="Diagnóstico: ERROR · "+(e.message||"revisar consola");
});
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(err => console.log("SW:", err));
  });
}
document.querySelector(".controls").style.top="64px";
render();
