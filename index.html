<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Control de Rutas 120209</title>
<style>
:root{--blue:#0b8cff;--ok:#0a9b62;--muted:#66788a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Arial;background:#061426;color:#102131;min-height:100vh;padding:8px}
.wrapper{max-width:760px;margin:0 auto;background:#fff;border-radius:16px;padding:16px}
#authBox{max-width:420px;margin:40px auto;background:#fff;padding:20px;border-radius:16px;text-align:center}
h1{font-size:20px;margin-bottom:8px}
.sub{font-size:12px;color:#555;margin-bottom:12px}
.summary-box{background:#e8f4fc;padding:12px;border-radius:10px;margin-bottom:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.summary-box div{padding:6px}
.summary-box strong{display:block;font-size:18px;color:#0b8cff}
.client-card{border:1px solid #cce0f0;border-radius:12px;padding:12px;margin:10px 0}
.name-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.client-name{font-weight:bold;font-size:14px}
.ref-cobro{width:92px;padding:4px 6px;border:1px solid #a7c8e0;border-radius:6px;font-size:13px;inputmode:decimal;placeholder:"Q a cobrar (ref)"}
.code-text{font-size:11px;color:#667;margin-bottom:8px}
.amount-area{display:flex;gap:6px;margin-top:8px}
.amount-area input{flex:1;padding:10px;border:1px solid #cbd7e3;border-radius:8px;font-size:15px}
.save-btn{padding:10px 12px;background:#0a9b62;color:white;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
#mainApp{display:none}
button{cursor:pointer}
input{font-size:16px}
</style>
</head>
<body>

<div id="authBox">
<h2>🔐 Ingreso Ruta 120209</h2>
<p style="margin:12px 0;font-size:14px">Ingresa contraseña para acceder</p>
<input id="passInput" type="password" placeholder="Contraseña" style="padding:10px;width:80%;border:1px solid #ccc;border-radius:8px">
<br><br>
<button onclick="ingresar()" style="padding:10px 20px;background:#0b8cff;color:white;border:none;border-radius:8px">Ingresar</button>
<p id="errorMsg" style="color:red;margin-top:8px;font-size:13px"></p>
</div>

<div id="mainApp" class="wrapper">
<h1>Control de Rutas · 120209</h1>
<div class="sub">39 clientes | Datos guardados automáticamente</div>

<div class="summary-box">
<div><strong id="totalRef">Q0.00</strong>Referencia total</div>
<div><strong id="totalRec">Q0.00</strong>Total recibido</div>
<div><strong id="cantCobrados">0/39</strong>Clientes cobrados</div>
</div>

<div id="listaClientes"></div>

<div style="margin-top:20px;display:flex;gap:10px">
<button onclick="exportarCSV()" style="padding:10px;background:#0b8cff;color:white;border:none;border-radius:8px">📥 Exportar CSV</button>
<button onclick="limpiarTodo()" style="padding:10px;background:#c42021;color:white;border:none;border-radius:8px">🗑️ Limpiar todos los datos</button>
</div>
</div>

<script>
const PASS_CORRECTA = "2425";
const CLAVE_STORAGE = "ruta_120209_datos";

const clientes = [
{c:"0001052884",n:"TIENDA SAN JOSE 2"},
{c:"0001386646",n:"RESTAURANTE VALENTINA"},
{c:"0001052675",n:"LIBRERÍA EL ÉXITO"},
{c:"0001055430",n:"TIENDA LA SURTIDORA"},
{c:"0001177030",n:"TIENDA EL ESTADIO VERAPAZ"},
{c:"0001422201",n:"TD JAMAI"},
{c:"0001052668",n:"TIENDA JERUSALEN"},
{c:"0001052671",n:"TIENDA ESTRELLA 2 MIGUEL LUS"},
{c:"0001052672",n:"TIENDA LA BENDICIÓN MANUEL TZU"},
{c:"0001223437",n:"TIENDA CARMENCITA II"},
{c:"0001422254",n:"LUJO DE CAFÉ"},
{c:"0001052718",n:"COMIDAS EL CHURRASQUITO"},
{c:"0001058451",n:"TIENDA Y SASTRERÍA VERAPAZ WEN"},
{c:"0001388708",n:"TIENDA LUNA"},
{c:"0001318078",n:"TIENDA DIEGUITO 2"},
{c:"0001235485",n:"TIENDA LA ESTRELLA"},
{c:"0001200273",n:"TIENDA AZUCENA"},
{c:"0001362041",n:"TIENDA FABIOLA 2 MANUEL CASTRO"},
{c:"0001326112",n:"ALIMENTOS TÍPICOS DE LA REGIÓN"},
{c:"0001053948",n:"MINITIENDA"},
{c:"0001287933",n:"VARIEDADES ESPERANZA"},
{c:"0001286200",n:"TIENDA LA SURTIDORA"},
{c:"0001352066",n:"TIENDA ESPERANSITA 2 ESPERANZA"},
{c:"0001413378",n:"LAS PICONAS"},
{c:"0001424126",n:"TIENDA LA BENDICIÓN"},
{c:"0001052769",n:"TIENDA LA VENTANITA"},
{c:"0001452472",n:"COMERCIAL ADONAI"},
{c:"0001287822",n:"DELI PANES"},
{c:"0001053968",n:"TIENDA SAN MIGUEL"},
{c:"0001316905",n:"RESTAURANTE SANIGUA"},
{c:"0001053933",n:"TIENDA LOS TRAVIESOS CARLOTA C"},
{c:"0001200268",n:"TIENDA CHATIO 2"},
{c:"0001421958",n:"LA FOGATA"},
{c:"0001373815",n:"SUPER 24 CARCHA 2"},
{c:"0001370582",n:"TIENDA YULY"},
{c:"0001421785",n:"MUNDO DE Q.3"},
{c:"0001329221",n:"INVERSIONES CESI SOCIEDAD ANÓNIMA"},
{c:"0001290683",n:"ABARROTES EL ALFARERO"},
{c:"0001424553",n:"GRANJERO COBÁN 519"}
];

// Cargar datos guardados
function cargarDatos(){
  try{
    return JSON.parse(localStorage.getItem(CLAVE_STORAGE)) || Array(clientes.length).fill({ref:"",rec:""})
  }catch(e){
    return Array(clientes.length).fill({ref:"",rec:""})
  }
}
let datosGuardados = cargarDatos();

// Ingreso contraseña
function ingresar(){
  const pass = document.getElementById("passInput").value.trim();
  if(pass === PASS_CORRECTA){
    document.getElementById("authBox").style.display = "none";
    document.getElementById("mainApp").style.display = "block";
    renderizarLista();
    actualizarResumen();
  }else{
    document.getElementById("errorMsg").innerText = "❌ Contraseña incorrecta";
  }
}

// Dibujar tarjetas
function renderizarLista(){
  const contenedor = document.getElementById("listaClientes");
  contenedor.innerHTML = "";
  clientes.forEach((cli, idx)=>{
    const tarjeta = document.createElement("div");
    tarjeta.className = "client-card";
    tarjeta.innerHTML = `
      <div class="name-row">
        <span class="client-name">${cli.n}</span>
        <input class="ref-cobro" id="ref_${idx}" type="number" step="0.01" placeholder="Q a cobrar (ref)" value="${datosGuardados[idx].ref}">
      </div>
      <div class="code-text">Código: ${cli.c}</div>
      <div class="amount-area">
        <input id="rec_${idx}" type="number" step="0.01" placeholder="Cantidad recibida Q" value="${datosGuardados[idx].rec}">
        <button class="save-btn" onclick="guardar(${idx})">Guardar</button>
      </div>
    `;
    contenedor.appendChild(tarjeta);
  })
}

// Guardar + actualizar resumen
function guardar(idx){
  const refVal = document.getElementById(`ref_${idx}`).value;
  const recVal = document.getElementById(`rec_${idx}`).value;
  datosGuardados[idx] = {ref:refVal, rec:recVal};
  localStorage.setItem(CLAVE_STORAGE, JSON.stringify(datosGuardados));
  actualizarResumen();
  alert("✅ Guardado correctamente");
}

// Calcular resumen
function actualizarResumen(){
  let sumaRef = 0, sumaRec = 0, cobrados = 0;
  datosGuardados.forEach(d=>{
    sumaRef += Number(d.ref) || 0;
    sumaRec += Number(d.rec) || 0;
    if(Number(d.rec) > 0) cobrados++;
  })
  document.getElementById("totalRef").innerText = `Q${sumaRef.toFixed(2)}`;
  document.getElementById("totalRec").innerText = `Q${sumaRec.toFixed(2)}`;
  document.getElementById("cantCobrados").innerText = `${cobrados}/39`;
}

// Exportar CSV
function exportarCSV(){
  let texto = "Código,Nombre,Referencia Q,Recibido Q\n";
  clientes.forEach((cli,idx)=>{
    texto += `${cli.c},"${cli.n}",${datosGuardados[idx].ref},${datosGuardados[idx].rec}\n`
  })
  const blob = new Blob([texto],{type:"text/csv;charset=utf‑8"});
  const enlace = document.createElement("a");
  enlace.href = URL.createObjectURL(blob);
  enlace.download = "ruta‑120209.csv";
  enlace.click();
  URL.revokeObjectURL(enlace.href);
}

// Limpiar todo
function limpiarTodo(){
  if(confirm("¿Estás seguro de borrar TODOS los datos guardados?")){
    datosGuardados = Array(clientes.length).fill({ref:"",rec:""});
    localStorage.setItem(CLAVE_STORAGE, JSON.stringify(datosGuardados));
    renderizarLista();
    actualizarResumen();
  }
}
</script>
</body>
</html>
